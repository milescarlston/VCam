name: Build VCam Rootful

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build VCam for iOS 14 Rootful
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg
        timeout-minutes: 10

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
        timeout-minutes: 10

      - name: Install iOS SDK
        run: |
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
          echo "Installed SDKs:"
          ls $HOME/theos/sdks/
        timeout-minutes: 10

      - name: Build Rootful VCam
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH

          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/postrm

          sed -i '' '/^Conflicts:/d;/^Replaces:/d;/^Provides:/d' control

          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootful

          echo "Build complete."
          echo "Generated packages:"
          ls -lh packages/

          echo "Package metadata:"
          for deb in packages/*.deb; do
            dpkg-deb -I "$deb"
          done
        timeout-minutes: 15

      - name: Prepare Output
        run: |
          mkdir -p output

          DEB=$(find packages -name "*.deb" | head -1)

          if [ -z "$DEB" ]; then
            echo "No .deb package was generated!"
            exit 1
          fi

          echo "Found package: $DEB"

          cp "$DEB" output/

          echo "Final output:"
          ls -lh output/

      - name: Upload VCam Rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: VCam-iOS14-Rootful
          path: output/*.deb
          retention-days: 30
